<svg width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- soap suds pile -->
  <ellipse cx="130" cy="360" rx="70" ry="22" fill="#e0f2ff"/>

  <!-- yellow basket -->
  <path d="M95 300 L105 380 L185 380 L195 300 Z" fill="#ffce33"/>
  <rect x="90" y="290" width="110" height="18" rx="6" fill="#ffdb63"/>

  <!-- green cloth hanging out of basket -->
  <path d="M120 300 Q100 330 130 350 Q150 335 140 300 Z" fill="#5fce6b"/>

  <!-- washing machine body -->
  <rect x="120" y="90" width="220" height="260" rx="26" fill="#2fa7e0"/>
  <rect x="120" y="90" width="220" height="260" rx="26" fill="none" stroke="#1f8cc4" stroke-width="4"/>

  <!-- top control panel -->
  <rect x="130" y="60" width="200" height="45" rx="14" fill="#f4f7fb"/>
  <circle cx="155" cy="82" r="10" fill="#ffce33"/>
  <circle cx="185" cy="82" r="10" fill="#ffce33"/>
  <rect x="215" y="74" width="70" height="16" rx="8" fill="#ffce33"/>

  <!-- folded towels on top -->
  <rect x="150" y="25" width="70" height="18" rx="4" fill="#2fa7e0"/>
  <rect x="150" y="43" width="70" height="18" rx="4" fill="#ffce33"/>
  <circle cx="235" cy="34" r="10" fill="#f4f7fb"/>

  <!-- drum -->
  <circle cx="230" cy="235" r="95" fill="#f4f7fb"/>
  <circle cx="230" cy="235" r="95" fill="none" stroke="#1f8cc4" stroke-width="6"/>
  <circle cx="230" cy="235" r="70" fill="#2fa7e0"/>
  <circle cx="230" cy="235" r="46" fill="#ffffff" opacity="0.85"/>

  <!-- small side button -->
  <circle cx="305" cy="140" r="10" fill="#ffce33"/>

  <!-- little shine on drum glass -->
  <path d="M200 200 Q215 185 235 190" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
